# Draait op de Raspberry Pi. Zet eerst een .env naast dit bestand met daarin
# minstens INGEST_TOKEN (zie .env.example).
services:
  dashboard:
    image: ghcr.io/maartendecat/waterput-dashboard:latest
    container_name: waterput-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Brussels
      INGEST_TOKEN: ${INGEST_TOKEN:?zet INGEST_TOKEN in .env}
      WATERPUT_DB_PATH: /data/waterput.db
    volumes:
      - waterput-data:/data

  poller:
    image: ghcr.io/maartendecat/waterput-poller:latest
    container_name: waterput-poller
    restart: unless-stopped
    depends_on:
      - dashboard
    environment:
      TZ: Europe/Brussels
      DASHBOARD_URL: http://dashboard:3000
      INGEST_TOKEN: ${INGEST_TOKEN:?zet INGEST_TOKEN in .env}
      # De naam binnen de container ligt vast door de devices-mapping hieronder
      # en hoort dus niet uit .env te komen.
      MODBUS_PORT: /dev/ttyUSB0
      MODBUS_SLAVE_ID: ${MODBUS_SLAVE_ID:-1}
      MODBUS_REGISTER: ${MODBUS_REGISTER:-256}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      SENSOR_MIN_MM: ${SENSOR_MIN_MM:-200}
      SENSOR_MAX_MM: ${SENSOR_MAX_MM:-5000}
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      HEALTHCHECK_FOUTEN_VOOR_ALARM: ${HEALTHCHECK_FOUTEN_VOOR_ALARM:-6}
    devices:
      # Links het stabiele by-id-pad op de host, rechts de simpele naam in de
      # container. Het pad verschilt per adapter en staat daarom in .env, niet
      # in dit bestand: zo overleeft je instelling een git pull.
      - ${MODBUS_DEVICE:?zet MODBUS_DEVICE in .env (zie ls -l /dev/serial/by-id/)}:/dev/ttyUSB0

volumes:
  waterput-data:
